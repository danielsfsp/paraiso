<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEP Louvor mudou de endereço</title>
<meta name="robots" content="noindex">
<script>
  // O app de produção foi desativado: tudo segue para o novo endereço,
  // mantendo links de música/playlist (#m=, #p=, #pl=...).
  (function(){
    var dest = 'https://paraiso-teste.danielsf-sp.workers.dev/' + (location.hash || '');
    try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }catch(e){}
    try{ if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }catch(e){}
    setTimeout(function(){ location.replace(dest); }, 300);
    document.addEventListener('DOMContentLoaded', function(){ var a = document.getElementById('go'); if(a) a.href = dest; });
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1a1210;color:#f5ece6;text-align:center;padding:16px}
  .box{max-width:420px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#cdbfb6;line-height:1.5}
  a{display:inline-block;margin-top:14px;background:#ea580c;color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <h1>🎵 O CEP Louvor mudou de endereço</h1>
    <p>Abrindo o novo endereço…<br>Salve este link no lugar do antigo:</p>
    <a id="go" href="https://paraiso-teste.danielsf-sp.workers.dev/">paraiso-teste.danielsf-sp.workers.dev</a>
  </div>
</body>
</html>
